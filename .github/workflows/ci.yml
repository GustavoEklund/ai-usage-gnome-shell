# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # gjs runs the integration test in the real runtime;
      # libglib2.0-bin provides glib-compile-schemas and gettext the xgettext target.
      - name: Install GNOME toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs libglib2.0-bin gettext

      - run: npm ci

      # Identical to what .githooks/pre-push runs locally.
      - run: make verify
