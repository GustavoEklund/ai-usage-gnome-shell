    M5.75 6.75a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z
    M10.25 6.75a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z
    M5.5 10.75h5a.75.75 0 0 1 0 1.5h-5a.75.75 0 0 1 0-1.5z
  "/>
  <rect fill="#808080" x="0" y="6.75" width="1.5" height="3.5" rx="0.75"/>
