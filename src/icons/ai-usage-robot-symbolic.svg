<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!--
    SPDX-License-Identifier: GPL-3.0-or-later
    SPDX-FileCopyrightText: 2026 Gustavo Eklund

    Drawn to Yaru's symbolic conventions: a 16x16 grid, solid filled shapes rather
    than outlines, holes cut with evenodd instead of painted in the background
    colour. Solid because the target size is 16px, where an outlined head turns to
    mush and a filled one still reads as a robot.

    The comments live INSIDE the root element on purpose. gdk-pixbuf identifies an
    image by sniffing its first bytes, so anything before `<svg` — an XML prologue,
    a licence header — makes the loader answer "Unrecognized image file format" and
    the icon silently renders as nothing.
  -->
  <path fill="#808080" fill-rule="evenodd" d="
